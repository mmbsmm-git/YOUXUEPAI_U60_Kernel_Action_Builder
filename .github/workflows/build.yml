name: U60 基线内核编译（纯编译）

# 重构后：本仓库只负责 clone → config → make → 上传产物。
#   ★ 零源码补丁、零 sed、零静态扫描、零 CRC / 符号 / dts 比对
#   ★ 内核源码仓库 = 通用 ALPS 基线 + 所有适配作为 commit 提交上去
#   ★ 本阶段目标只有一个：build OK；分析阶段以后再启用 diff_report.py
#
# 为什么用 docker run 而不是 runs-on: ubuntu-20.04：
#   GitHub 托管的 20.04 runner 已于 2025-04-15 退役；
#   而 MTK DrvGen 需要 python2，只有 focal 的 universe 里还有现成包。
#   所以：宿主 ubuntu-24.04 + 容器 ubuntu:20.04，依赖首次构建后固化在 GHCR。

on:
  workflow_dispatch:
    inputs:
      KERNEL_REPO:
        description: '内核源码仓库（由「初始化」workflow 建出来的那个）'
        required: true
        default: 'https://github.com/mmbsmm-git/YOUXUEPAI_U60_Kernel'
      KERNEL_REF:
        description: '分支 / tag / sha'
        required: true
        default: 'main'
      BUILD_KERNEL:
        description: '是否真的编译'
        required: true
        type: choice
        options: ['true', 'false']
        default: 'true'
      CLANG_URL:
        description: 'clang-4691093 包地址（googlesource 不通时换镜像）'
        required: true
        default: 'https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android-9.0.0_r1/clang-4691093.tar.gz'

jobs:
  build:
    name: 编译 U60 基线内核
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      packages: write      # 推 GHCR 预构建镜像
    env:
      # Dockerfile / install-deps.sh 没改 → 镜像继续复用，不用换 tag
      IMAGE_TAG: u60-kernel-4.4-builder:latest

    steps:
    - name: 显示运行参数
      run: |
        echo "::group::参数"
        echo "KERNEL_REPO  : ${{ github.event.inputs.KERNEL_REPO }}"
        echo "KERNEL_REF   : ${{ github.event.inputs.KERNEL_REF }}"
        echo "BUILD_KERNEL : ${{ github.event.inputs.BUILD_KERNEL }}"
        echo "CLANG_URL    : ${{ github.event.inputs.CLANG_URL }}"
        echo "::endgroup::"

    - name: 检出仓库 (Check Out)
      uses: actions/checkout@v4

    - name: 清理环境（保留 Docker）
      uses: rokibhasansagar/slimhub_actions@main
      with:
        retain: "docker_buildkit,docker_imgcache"

    - name: 初始化工作目录
      id: pwd
      run: |
        mkdir -p workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> "$GITHUB_OUTPUT"

    - name: 设置交换空间 (Swap)
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: 拉取预构建镜像（不存在才构建并固化一次）
      run: |
        set -e
        REPO_LOWER=$(echo "${{ github.repository }}" | tr 'A-Z' 'a-z')
        IMAGE="ghcr.io/${REPO_LOWER}/${IMAGE_TAG}"
        echo "Using image: $IMAGE"
        echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        export DOCKER_BUILDKIT=1
        if docker pull "$IMAGE"; then
          echo "使用 GHCR 现成镜像（依赖已固化）: $IMAGE"
        else
          echo "GHCR 暂无镜像，构建并推送（仅首次）..."
          docker build --cache-from "$IMAGE" -t "$IMAGE" -f Dockerfile .
          docker push "$IMAGE"
          echo "镜像已固化到 GHCR: $IMAGE"
        fi

    # /repo 只读放 baseline + scripts，/workspace 可写放工具链 / 源码 / 输出。
    # 主逻辑放在 scripts/build.sh，YAML 里不塞大段 shell。
    - name: 容器内 clone / 配置 / 编译
      run: |
        set -e
        WS="${{ steps.pwd.outputs.workspace-folder }}"
        docker run --rm \
          -v "$WS:/workspace" \
          -v "${{ github.workspace }}:/repo:ro" \
          -e KERNEL_REPO="${{ github.event.inputs.KERNEL_REPO }}" \
          -e KERNEL_REF="${{ github.event.inputs.KERNEL_REF }}" \
          -e BUILD_KERNEL="${{ github.event.inputs.BUILD_KERNEL }}" \
          -e CLANG_URL="${{ github.event.inputs.CLANG_URL }}" \
          "$IMAGE" bash -e -c 'bash /repo/scripts/build.sh'

    - name: 写入 Step Summary
      if: always()
      run: |
        SUM="${{ steps.pwd.outputs.workspace-folder }}/out/summary.md"
        if [ -f "$SUM" ]; then
          cat "$SUM" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "## U60 基线内核（纯编译）" >> "$GITHUB_STEP_SUMMARY"
          echo "summary 未生成，请看上方日志与 Artifact。" >> "$GITHUB_STEP_SUMMARY"
        fi

    # ------------------------------------------------------------------
    # 编译成功 → 自动发 Release（永久留存；Artifact 只有 30 天）。
    # build.sh 即使编译失败也会以 0 退出，所以不能靠 job 成功与否判断，
    # 一律读 out/steps.tsv 里的 build 行。失败时只留 Artifact，不建空 Release。
    # 仓库改名不影响这里：全部用 github.repository / github.run_id 动态取值。
    # ------------------------------------------------------------------
    - name: 判定编译结果
      id: verdict
      if: ${{ !cancelled() }}
      run: |
        TS="${{ steps.pwd.outputs.workspace-folder }}/out/steps.tsv"
        if [ -f "$TS" ] && awk -F'\t' '$1=="build" && $2=="OK" {ok=1} END {exit ok?0:1}' "$TS"; then
          echo "build_ok=true" >> "$GITHUB_OUTPUT"
          echo "编译结果: OK → 将发布 Release"
        else
          echo "build_ok=false" >> "$GITHUB_OUTPUT"
          echo "编译结果: 非 OK → 跳过 Release，仅保留 Artifact"
        fi

    - name: 打包成功产物
      id: package
      if: ${{ !cancelled() && steps.verdict.outputs.build_ok == 'true' }}
      run: |
        set -e
        command -v zip >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq zip; }
        WS="${{ steps.pwd.outputs.workspace-folder }}"
        PKG="${{ runner.temp }}/u60-kernel-build-${{ github.run_id }}.zip"
        rm -f "$PKG"
        LIST=""
        for f in artifacts logs steps.tsv summary.md; do
          [ -e "$WS/out/$f" ] && LIST="$LIST $f"
        done
        ( cd "$WS/out" && zip -q -r "$PKG" $LIST )
        ls -lh "$PKG"
        echo "pkg=$PKG" >> "$GITHUB_OUTPUT"

    - name: 发布到 Releases
      if: ${{ !cancelled() && steps.verdict.outputs.build_ok == 'true' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -e
        command -v gh >/dev/null || { echo "::error::runner 缺少 gh CLI"; exit 1; }
        WS="${{ steps.pwd.outputs.workspace-folder }}"
        PKG="${{ steps.package.outputs.pkg }}"
        TAG="u60-kernel-${{ github.run_id }}"
        NOTES="${{ runner.temp }}/u60-release-notes.md"
        {
          echo "## U60 基线内核 · 编译成功"
          echo
          echo "| 项 | 值 |"
          echo "|---|---|"
          echo "| run | \`${{ github.run_id }}\` |"
          echo "| 源码 | \`${{ github.event.inputs.KERNEL_REPO }} @ ${{ github.event.inputs.KERNEL_REF }}\` |"
          echo "| 触发 commit | \`${{ github.sha }}\` |"
          echo
          echo "产物：\`vmlinux\` / \`Module.symvers\` / \`Image.gz-dtb\` / \`autoconf.h\` / \`build.log\`"
          echo
          echo "### steps.tsv"
          echo '```'
          cat "$WS/out/steps.tsv"
          echo '```'
        } > "$NOTES"
        ASSETS=( "$PKG" )
        for f in "$WS/out/steps.tsv" "$WS/out/summary.md" \
                 "$WS/out/artifacts/Module.symvers"; do
          [ -f "$f" ] && ASSETS+=( "$f" )
        done
        # 手动 Re-run 时 run_id 不变、tag 已存在 → 改成覆盖上传，避免整步失败
        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "Release 已存在（重跑），覆盖上传同名 asset"
          gh release upload "$TAG" "${ASSETS[@]}" --clobber
        else
          gh release create "$TAG" "${ASSETS[@]}" \
            --title "U60 基线内核 ${{ github.run_id }} (build OK)" \
            --notes-file "$NOTES"
        fi
        echo "✅ Release: https://github.com/${{ github.repository }}/releases/tag/$TAG"

    - name: 上传产物与日志 (Artifact)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: u60-kernel-build-${{ github.run_id }}
        retention-days: 30
        if-no-files-found: warn
        path: |
          ${{ steps.pwd.outputs.workspace-folder }}/out/summary.md
          ${{ steps.pwd.outputs.workspace-folder }}/out/steps.tsv
          ${{ steps.pwd.outputs.workspace-folder }}/out/artifacts/
          ${{ steps.pwd.outputs.workspace-folder }}/out/logs/
